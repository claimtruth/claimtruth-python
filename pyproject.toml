[project]
name = "claimtruth"
version = "0.1.0.dev0"
description = "Checks whether a cited source supports a claim at the claim's stated scope and strength."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Vignesh Sathiyamurthy", email = "vignesh.satya4@gmail.com" },
    { name = "Ashwini Saravanan", email = "ashwiniradha248@gmail.com" },
    { name = "Raveendhar Santhanam", email = "sanjuravi134@gmail.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "litellm>=1.102.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.1.1",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.scripts]
claimtruth = "claimtruth.cli:app"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
markers = [
    "golden: golden hard-case set (run with -m golden)",
    "vcr: test replays recorded HTTP cassettes",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-recording>=0.13.4",
    "ruff>=0.16.9",
    "syrupy>=6.1.1",
]
